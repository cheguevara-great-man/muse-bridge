server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/muse-bridge/tls/server-crt.pem;
    ssl_certificate_key /etc/muse-bridge/tls/server-key.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name ${VPS_SNI};

    ssl_certificate /etc/muse-bridge/tls/server-crt.pem;
    ssl_certificate_key /etc/muse-bridge/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/muse-bridge.access.log;
    error_log /var/log/nginx/muse-bridge.error.log;

    location /muse-bridge {
        proxy_pass http://127.0.0.1:8471;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /muse-api/ {
        proxy_pass http://127.0.0.1:8471;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
